  api-gateway:
    build:
      context: ./services/API_Gatewya
    container_name: api-gateway
    restart: on-failure
    depends_on:
      - user-service
      - doctor-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      USER_SERVICE_URL: http://user-service:8081
      DOCTOR_SERVICE_URL: http://doctor-service:8083
    networks:
      - serenity-network

