version: '3.8'
services:
  db:
    image: postgres:15
    container_name: doctors-db
    environment:
      POSTGRES_DB: doctors_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: doctors-redis

  backend:
    build: .
    container_name: doctors-service
    ports:
      - "8083:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_REDIS_HOST: redis      # ← ajouté
      SPRING_REDIS_PORT: "6379"     # ← ajouté
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
