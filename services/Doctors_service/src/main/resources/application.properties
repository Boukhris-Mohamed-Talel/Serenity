spring.application.name=Doctors_service

# Load optional local secrets from a file that is gitignored (see application-local.properties.example).
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=postgres
# Never commit real passwords here. Use DB_PASSWORD env var and/or application-local.properties (gitignored).
spring.datasource.password=root

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8083}

# Optional Spring Security default user — set via env or application-local.properties (not committed).
spring.security.user.name=${BASIC_AUTH_USER:admin}
spring.security.user.password=${BASIC_AUTH_PASSWORD:admin123}

