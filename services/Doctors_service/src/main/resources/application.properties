spring.application.name=Doctors_service

# -----------------------------------------------------------------------------
# Local developer convenience (gitignored files):
# - `application-local.properties`   : your machine-only overrides (DB password, etc.)
# - `application-secrets.properties` : tokens/secrets (jwt.secret, smtp keys, ...)
#
# This project previously relied on `application-secrets.properties` only, but that
# file is gitignored, so a fresh clone would start with no `jwt.secret` and fail.
#
# These imports make the service boot reliably while keeping secrets out of git.
# -----------------------------------------------------------------------------
spring.config.import=\
  optional:classpath:application-secrets.properties,\
  optional:classpath:application-local.properties,\
  optional:file:./services/Doctors_service/src/main/resources/application-secrets.properties,\
  optional:file:./services/Doctors_service/src/main/resources/application-local.properties

# --- Data source ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Redis ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# --- JPA ---
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Server ---
server.port=${SERVER_PORT:8083}

# --- Basic auth (optional defaults for local) ---
spring.security.user.name=${SPRING_SECURITY_USERNAME:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin}

# --- JWT (required; typically provided via imported secrets file) ---
# Set `jwt.secret` in one of:
# - OS/IDE env var → `JWT_SECRET` (then uncomment next line), or
# - `application-secrets.properties` (gitignored, imported above)
#jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Used by DoctorVerificationService for scheduled/internal calls (override locally).
SCHEDULER_JWT=${SCHEDULER_JWT:}

# --- Mail (optional) ---
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${BREVO_USERNAME:}
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:smtp-relay.brevo.com}
spring.mail.properties.mail.debug=${MAIL_DEBUG:true}

