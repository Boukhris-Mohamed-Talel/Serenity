server:
  port: ${SERVER_PORT:8091}

spring:
  config:
    import: optional:classpath:application-google-local.yml, optional:classpath:application-mail-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/appointments_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # SMTP (JavaMail) — not the Gmail API. Keep credentials in application-mail-local.yml or env MAIL_USERNAME / MAIL_PASSWORD.
  # Do not use empty username/password here — that prevents optional application-mail-local.yml from applying.
  # INTERNAL_API_KEY must match user-service for /api/internal/users/emails-by-ids.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  google:
    calendar:
      enabled: ${GOOGLE_CALENDAR_ENABLED:true}
      # client-id / client-secret: use application-google-local.yml (imported above) or env:
      #   APP_GOOGLE_CALENDAR_CLIENT_ID, APP_GOOGLE_CALENDAR_CLIENT_SECRET
      # Optional JSON path still read by GoogleCalendarCredentialsLoader if set:
      credentials-json-path: ${GOOGLE_CALENDAR_CREDENTIALS_JSON:}
      # Must match Google Cloud Console → OAuth client → Authorized redirect URIs exactly
      redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:4200/appointments/oauth/calendar}
  # Default matches user-service so local dev resolves emails without exporting INTERNAL_API_KEY.
  internal-api-key: ${INTERNAL_API_KEY:serenity-internal-key-dev}
  user-service:
    # Same host as the SPA apiUrl gateway (8082) so lookups work when only the gateway exposes /api/users.
    # Use http://localhost:8081 if you run user-service without the gateway.
    base-url: ${USER_SERVICE_URL:http://localhost:8082}
    # Email lookup: direct user-service (8081) or gateway (8082) if it routes /api/internal/** (see API gateway config).
    internal-base-url: ${USER_SERVICE_INTERNAL_URL:http://localhost:8081}
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47
  teleconsultation:
    default-duration-minutes: ${TELECONSULT_DEFAULT_MINUTES:30}
    jitsi-room-prefix: ${JITSI_ROOM_PREFIX:serenity-appt}
