# =============================================================================
# Appointment microservice — single configuration source (application.properties).
# Secrets and environment-specific values MUST be supplied via OS / container /
# IDE environment variables or an external config server. No .env files.
#
# Required for a normal startup (set all of these):
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, INTERNAL_API_KEY
#
# JWT_SECRET must be Base64-encoded bytes (same format as user-service / gateway).
# =============================================================================

# --- Server ---
server.port=${SERVER_PORT:8091}

# --- Data source (required) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA (non-secret tunables may use defaults) ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${JPA_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# --- Mail / SMTP (optional; leave user/password empty to skip sending mail) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}

# --- Google Calendar OAuth (optional when disabled or credentials omitted) ---
app.google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:true}
app.google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
app.google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
app.google.calendar.credentials-json-path=${GOOGLE_CALENDAR_CREDENTIALS_JSON:}
app.google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:4200/appointments/oauth/calendar}

# --- Internal calls to user-service (required key; URLs are externalized) ---
app.internal-api-key=${INTERNAL_API_KEY}
app.user-service.base-url=${USER_SERVICE_URL}
app.user-service.internal-base-url=${USER_SERVICE_INTERNAL_URL}

# --- JWT validation (must match issuing service; Base64 secret) ---
app.jwt.secret=${JWT_SECRET}

# --- Teleconsultation defaults ---
app.teleconsultation.default-duration-minutes=${TELECONSULT_DEFAULT_MINUTES:30}
app.teleconsultation.jitsi-room-prefix=${JITSI_ROOM_PREFIX:serenity-appt}
