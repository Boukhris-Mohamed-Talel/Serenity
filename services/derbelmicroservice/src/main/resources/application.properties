spring.application.name=derbelmicroservice
server.port=8099

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/medical_records_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS (Angular dev : ng serve sur le port 4200)
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
app.cors.allow-credentials=true
