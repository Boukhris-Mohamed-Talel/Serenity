spring:
  application:
    name: API_Gatewya
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: insurance-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/insurance/**
        - id: insurance-files
          uri: http://localhost:8090
          predicates:
            - Path=/api/files/**
        - id: marketplace-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/marketplace/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:4200"
              - "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true

server:
  port: 8082

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
    expiration-ms: ${JWT_EXPIRATION:86400000}
