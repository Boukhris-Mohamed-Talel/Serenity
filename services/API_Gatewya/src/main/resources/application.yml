spring:
  application:
    name: API_Gatewya
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: derbel-service
          uri: http://localhost:8099
          predicates:
            - Path=/patients/**,/records/**,/prescriptions/**,/medicines/**,/dashboard/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:4200"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true

server:
  port: 8082
