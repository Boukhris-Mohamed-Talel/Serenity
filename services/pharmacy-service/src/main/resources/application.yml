server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${COMMERCE_DB_NAME:healthcare_commerce_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
  user-db:
    url: ${USER_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${CORE_DB_NAME:healthcare_core_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${USER_DB_USERNAME:root}
    password: ${USER_DB_PASSWORD:}
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
    me-url: ${USER_SERVICE_ME_URL:http://localhost:8081/api/users/me}
    admin-email: ${USER_SERVICE_ADMIN_EMAIL:}
    admin-password: ${USER_SERVICE_ADMIN_PASSWORD:}
