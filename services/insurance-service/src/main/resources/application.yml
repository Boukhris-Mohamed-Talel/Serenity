server:
  port: ${SERVER_PORT:8090}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/healthcare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  public-base-url: ${INSURANCE_PUBLIC_BASE_URL:http://localhost:8090}
  insurance-portal:
    api-url: ${INSURANCE_PORTAL_API_URL:http://localhost:3000/api}
  status-poller:
    fixed-delay-ms: ${INSURANCE_STATUS_POLLER_DELAY_MS:5000}
