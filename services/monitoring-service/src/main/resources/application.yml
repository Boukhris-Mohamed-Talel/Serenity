server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: monitoring-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/healthcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        generate_statistics: false

logging:
  level:
    root: INFO
    com.serenity.monitoring: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
  digest:
    cron: ${MONITORING_WEEKLY_DIGEST_CRON:0 0 8 ? * MON}
    timezone: ${MONITORING_WEEKLY_DIGEST_TIMEZONE:Africa/Tunis}
  cleanup:
    cron: ${MONITORING_CLEANUP_CRON:0 0 3 * * ?}
    timezone: ${MONITORING_CLEANUP_TIMEZONE:Africa/Tunis}
    retention-days: ${MONITORING_CLEANUP_RETENTION_DAYS:90}
  # Python FastAPI in Serenity/services/monitoring -ai (default port 5150)
  monitoring-ai:
    enabled: ${MONITORING_AI_ENABLED:true}
    url: ${MONITORING_AI_URL:http://localhost:5150}
