server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/healthcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:raefhossni@gmail.com}
    password: ${SMTP_PASSWORD:rhwt ksis csqy pezj}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  # Shared with appointment-service for reminder emails (X-Internal-Key on POST /api/internal/users/emails-by-ids)
  internal-api-key: ${INTERNAL_API_KEY:serenity-internal-key-dev}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  public-base-url: ${USER_PUBLIC_BASE_URL:http://localhost:8081}
  insurance:
    api-url: ${INSURANCE_API_URL:http://localhost:3000/api}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:839671631677-mn9nlmrhu23km56obikov37g1vnh08m3.apps.googleusercontent.com}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      app-secret: ${FACEBOOK_APP_SECRET:}
  password-reset:
    otp-length: ${PASSWORD_RESET_OTP_LENGTH:6}
    otp-ttl-seconds: ${PASSWORD_RESET_OTP_TTL_SECONDS:300}
    otp-max-attempts: ${PASSWORD_RESET_OTP_MAX_ATTEMPTS:5}
    reset-token-ttl-seconds: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:900}
  ban:
    # Every 30 minutes on the clock (:00, :30)
    cleanup-cron: ${BAN_CLEANUP_CRON:0 0/30 * * * *}
    cleanup-zone: ${BAN_CLEANUP_ZONE:Africa/Tunis}
  mail:
    from: ${MAIL_FROM:raefhossni@gmail.com}

