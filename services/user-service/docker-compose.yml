services:

  mysql:
    image: mysql:8
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: healthcare
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  user-service:
    build: .
    container_name: user-service
    restart: always
    depends_on:
      - mysql
      - redis
    ports:
      - "8081:8081"
    env_file:
      - .env

volumes:
  mysql_data:
