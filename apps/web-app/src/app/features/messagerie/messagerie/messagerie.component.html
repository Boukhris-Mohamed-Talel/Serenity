<div class="main-content">
  <div class="messagerie">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Messages</h3>

        <div class="search-wrapper">
          <input
            type="text"
            placeholder="Search..."
            [(ngModel)]="searchTerm"
            (input)="onSearch()"
            (focus)="onFocusSearch()"
            class="search-bar"
          />
          <button *ngIf="searchActive" class="cancel-btn" (click)="cancelSearch()">X</button>
        </div>

        <div *ngIf="searchActive && searchTerm.trim() && filteredUsers.length > 0" class="search-results">
          <div
            *ngFor="let user of filteredUsers"
            class="search-user"
            (click)="selectUser(user)"
            (keydown.enter)="selectUser(user)"
            (keydown.space)="selectUser(user)"
          >
            {{ user.firstName }} {{ user.lastName }}
          </div>
        </div>
      </div>

      <!-- ✅ Show conversations regardless of searchActive so they appear after selecting a user -->
      <div class="conversation-list">
        <div
          class="conversation"
          *ngFor="let convo of filteredConversations"
          [ngClass]="{ active: convo.id === activeConversationId }"
          (click)="selectConversation(convo)"
          (keydown.enter)="selectConversation(convo)"
          (keydown.space)="selectConversation(convo)"
          (contextmenu)="openConversationMenu($event, convo)"
        >
          <div class="avatar"></div>
          <div class="conversation-info">
            <div class="name">{{ convo.otherUserName }}</div>
            <div class="last-message">{{ convo.lastMessage }}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Context menu for conversation -->
    <div
      class="context-menu"
      *ngIf="conversationMenuVisible"
      [style.top.px]="conversationMenuY"
      [style.left.px]="conversationMenuX"
      (click)="$event.stopPropagation()"
    >
      <div
        class="menu-item delete"
        (click)="deleteConversationClicked()"
        (keydown.enter)="deleteConversationClicked()"
        (keydown.space)="deleteConversationClicked()"
      >
        Delete this conversation
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" *ngIf="activeConversationId">
      <div class="chat-header">
        <div class="avatar"></div>
        <div class="chat-name">{{ activeConversationName }}</div>
      </div>

      <div class="messages" #messagesContainer>
        <div
          class="message"
          *ngFor="let msg of messages; let i = index"
          [ngClass]="msg.type"
          (contextmenu)="openMenu($event, i)"
        >
          <div class="bubble" *ngIf="editingIndex !== i" (dblclick)="startEdit(i)">
            {{ msg.text }}
          </div>

          <input
            *ngIf="editingIndex === i"
            type="text"
            [(ngModel)]="editText"
            (keyup.enter)="saveEditMessage(i)"
            (blur)="cancelEdit()"
            class="edit-input"
            autofocus
          />
        </div>
      </div>

      <!-- Context menu for message -->
      <div
        class="context-menu"
        *ngIf="menuVisible"
        [style.top.px]="menuY"
        [style.left.px]="menuX"
        (click)="$event.stopPropagation()"
      >
        <div class="menu-item delete" (click)="removeMessage()">Delete Message</div>
      </div>

      <div class="message-input">
        <input
          type="text"
          [(ngModel)]="messageContent"
          (keyup.enter)="sendMessage()"
          placeholder="Type a message..."
        />
        <button class="send-btn" (click)="sendMessage()">Send</button>
      </div>
    </div>

  </div>
</div>
