
<div class="main-content">
  <div class="messagerie">
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Messages</h3>
        <input type="text" placeholder="Search..." [(ngModel)]="searchTerm" (input)="onSearch()" />
          <div *ngFor="let user of filteredUsers">
            {{ user.firstName }} {{ user.lastName }}
          </div>
      </div>

      <div class="conversation-list">
        <div
          class="conversation"
          *ngFor="let convo of filteredConversations"
          [ngClass]="{ active: convo.id === activeConversationId }"
          (click)="selectConversation(convo)"
        >
          <div class="avatar"></div>
          <div class="conversation-info">
            <div class="name">{{ convo.name }}</div>
            <div class="last-message">{{ convo.lastMessage }}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <div class="avatar"></div>
        <div class="chat-name">{{ activeConversationName }}</div>
      </div>

      <div class="messages">
        <div
          class="message"
          *ngFor="let msg of messages; let i = index"
          [ngClass]="msg.type"
          (contextmenu)="openMenu($event, i)"
        >
          <div class="bubble">
            <span *ngIf="editingIndex !== i">{{ msg.text }}</span>

            <input
              *ngIf="editingIndex === i"
              [(ngModel)]="editText"
              (keydown.enter)="saveEdit()"
            />
          </div>
        </div>
      </div>

      <div
        class="context-menu"
        *ngIf="menuVisible"
        [style.top.px]="menuY"
        [style.left.px]="menuX"
      >
        <div class="menu-item" (click)="editMessage()">Modify</div>
        <div class="menu-item delete" (click)="deleteMessage()">Delete</div>
      </div>

      <div class="message-input">
        <input
          type="text"
          [(ngModel)]="newMessage"
          placeholder="Type a message..."
          (keydown.enter)="sendMessage()"
        />
        <button class="send-btn" (click)="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>
