<div class="container medical-page">
  <div class="page-head">
    <h1>{{ isEdit ? 'Modifier le dossier médical' : 'Nouveau dossier médical' }}</h1>
  </div>

  <p class="breadcrumb" *ngIf="patientId">
    <a routerLink="/patients">Patients</a>
    <span class="sep">/</span>
    <a [routerLink]="['/patients', patientId]">Patient #{{ patientId }}</a>
    <span class="sep">/</span>
    <a [routerLink]="['/patients', patientId, 'records']">Dossiers</a>
  </p>

  <div *ngIf="loading" class="state-muted">Chargement…</div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="card-form" *ngIf="!loading">
    <div class="form-grid">
      <label class="field full">
        <span>Diagnostic *</span>
        <input type="text" formControlName="diagnosis" maxlength="255" />
        <small class="err" *ngIf="form.get('diagnosis')?.invalid && form.get('diagnosis')?.touched">Obligatoire, max 255 caractères</small>
      </label>
      <label class="field">
        <span>Date *</span>
        <input type="date" formControlName="date" />
      </label>
      <label class="field">
        <span>Sévérité *</span>
        <select formControlName="severity">
          <option *ngFor="let s of severities" [value]="s">{{ s }}</option>
        </select>
      </label>
      <label class="field">
        <span>Statut *</span>
        <input type="text" formControlName="status" placeholder="ACTIVE ou CLOSED" />
      </label>
      <label class="field full">
        <span>Notes</span>
        <textarea formControlName="notes" rows="4" maxlength="2000"></textarea>
      </label>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving">Enregistrer</button>
    </div>
  </form>
</div>
