<div class="container medical-page">
  <div class="page-head">
    <h1>{{ isEdit ? 'Edit prescription' : 'New prescription' }}</h1>
  </div>

  <p class="breadcrumb" *ngIf="patientId && recordId">
    <a routerLink="/patients">Patients</a>
    <span class="sep">/</span>
    <a [routerLink]="['/patients', patientId]">Patient</a>
    <span class="sep">/</span>
    <a [routerLink]="['/patients', patientId, 'records']">Records</a>
    <span class="sep">/</span>
    <a [routerLink]="['/patients', patientId, 'records', recordId, 'prescriptions']">Prescriptions</a>
  </p>

  <div *ngIf="loading" class="state-muted">Loading…</div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="card-form" *ngIf="!loading">
    <div class="form-grid">
      <label class="field">
        <span>Prescription Status *</span>
        <select formControlName="status">
          <option value="ACTIVE">ACTIVE</option>
          <option value="COMPLETED">COMPLETED</option>
          <option value="CANCELLED">CANCELLED</option>
        </select>
      </label>

      <div class="field full">
        <div class="medication-header">
          <span>Medications</span>
          <button type="button" class="btn btn-secondary" (click)="addItem()">+ Add medication</button>
        </div>
        <div formArrayName="items">
          <div class="medication-block" *ngFor="let item of itemsArray.controls; let i = index" [formGroupName]="i">
            <div class="medication-block-title">
              <strong>Item {{ i + 1 }}</strong>
              <button type="button" class="btn btn-secondary" (click)="removeItem(i)" [disabled]="itemsArray.length === 1">Remove</button>
            </div>
            <div class="form-grid">
              <label class="field full">
                <span>Medicine *</span>
                <select formControlName="medicineId">
                  <option value="" disabled>-- Select a medicine --</option>
                  <option *ngFor="let med of medicines" [ngValue]="med.id">{{ med.name }}</option>
                </select>
              </label>
              <label class="field">
                <span>Dosage *</span>
                <input type="text" formControlName="dosage" maxlength="50" />
              </label>
              <label class="field">
                <span>Frequency *</span>
                <input type="text" formControlName="frequency" maxlength="50" />
              </label>
              <label class="field">
                <span>Quantity *</span>
                <input type="number" formControlName="quantity" min="1" />
              </label>
              <label class="field">
                <span>Start date *</span>
                <input type="date" formControlName="startDate" />
              </label>
              <label class="field">
                <span>End date</span>
                <input type="date" formControlName="endDate" />
              </label>
              <label class="field full">
                <span>Instructions</span>
                <textarea formControlName="instructions" rows="3" maxlength="500"></textarea>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving">Save</button>
    </div>
  </form>
</div>
