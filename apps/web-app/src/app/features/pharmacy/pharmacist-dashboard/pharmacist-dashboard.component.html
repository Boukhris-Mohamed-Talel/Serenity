<section class="page">
  <header class="page-header">
    <h1>Pharmacist Workspace</h1>
    <p>Track prescription flow and keep sensitive medication pickup controlled.</p>
  </header>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="stats" *ngIf="!loading">
    <article class="card">
      <h3>Total Inbox</h3>
      <p>{{ total }}</p>
    </article>

    <article class="card warning">
      <h3>Pending</h3>
      <p>{{ pending }}</p>
    </article>

    <article class="card success">
      <h3>Ready for Pickup</h3>
      <p>{{ ready }}</p>
    </article>

    <article class="card danger">
      <h3>Rejected</h3>
      <p>{{ rejected }}</p>
    </article>
  </div>

  <div class="actions">
    <a routerLink="/pharmacy/my-pharmacy" class="btn">Manage My Pharmacy</a>
    <a routerLink="/pharmacy/inbox" class="btn">Open Prescription Inbox</a>
  </div>
</section>
