<div class="discount-container">
  <h5>Apply Coupon Code</h5>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="appliedCoupon" class="coupon-applied">
    <div class="coupon-success">
      <p class="coupon-code">✓ Code: <strong>{{ appliedCoupon.code }}</strong></p>
      <p class="coupon-discount">
        Discount: <strong>{{ appliedCoupon.discountPercentage }}%</strong> (-{{ appliedCoupon.discountAmount | currency }})
      </p>
      <button class="btn btn-sm btn-outline-danger" (click)="removeCoupon()">Remove Coupon</button>
    </div>
  </div>

  <div *ngIf="!appliedCoupon" class="coupon-form">
    <form [formGroup]="couponForm" (ngSubmit)="validateCoupon()" class="form-inline">
      <div class="form-group">
        <input 
          type="text" 
          formControlName="code"
          class="form-control"
          placeholder="Enter coupon code"
          [disabled]="loading"
        />
      </div>
      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="!couponForm.valid || loading"
      >
        {{ loading ? 'Validating...' : 'Apply' }}
      </button>
    </form>
  </div>

  <div *ngIf="appliedCoupon && discountAmount > 0" class="discount-summary">
    <p class="discount-text">You save: <span class="discount-value">{{ discountAmount | currency }}</span></p>
  </div>
</div>
