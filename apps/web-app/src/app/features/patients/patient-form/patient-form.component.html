<div class="container medical-page">
  <div class="page-head">
    <h1>{{ isEdit ? 'Edit patient' : 'New patient' }}</h1>
  </div>

  <div *ngIf="loading" class="state-muted">Loading…</div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="card-form" *ngIf="!loading">
    <div class="form-grid">
      <label class="field">
        <span>First name *</span>
        <input type="text" formControlName="firstName" autocomplete="given-name" />
        <small class="err" *ngIf="form.get('firstName')?.invalid && form.get('firstName')?.touched">Required (2–50 characters)</small>
      </label>
      <label class="field">
        <span>Last name *</span>
        <input type="text" formControlName="lastName" autocomplete="family-name" />
        <small class="err" *ngIf="form.get('lastName')?.invalid && form.get('lastName')?.touched">Required (2–50 characters)</small>
      </label>
      <label class="field">
        <span>Date of birth</span>
        <input type="date" formControlName="dateOfBirth" />
      </label>
      <label class="field">
        <span>Gender</span>
        <input type="text" formControlName="gender" maxlength="10" />
      </label>
      <label class="field">
        <span>Blood type</span>
        <input type="text" formControlName="bloodType" maxlength="5" />
      </label>
      <label class="field">
        <span>Phone</span>
        <input type="text" formControlName="phone" maxlength="20" />
      </label>
      <label class="field full">
        <span>Allergies</span>
        <textarea formControlName="allergies" rows="3" maxlength="500"></textarea>
      </label>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ isEdit ? 'Save' : 'Create' }}
      </button>
    </div>
  </form>
</div>
