<div class="container">
  <div class="page-header">
    <h1>Doctors Management</h1>
  </div>

  <div *ngIf="error" class="alert alert-error">
    {{ error }}
  </div>

  <div *ngIf="isLoading" class="loading-container">
    <span class="spinner"></span>
    <p>Loading doctors...</p>
  </div>

  <div *ngIf="!isLoading && doctors.length === 0" class="empty-state card">
    <p>No doctors found.</p>
  </div>

  <div *ngIf="!isLoading && doctors.length > 0" class="card table-container">
    <table>
      <thead>
        <tr>
          <th>Doctor Name</th>
          <th>Photo</th>
          <th>Specialty</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let doctor of doctors">
          <td>{{ getFullName(doctor) }}</td>
          <td>
            <img 
              *ngIf="getProfilePictureUrl(doctor) as imageUrl"
              [src]="imageUrl" 
              alt="{{ getFullName(doctor) }} profile picture"
              class="profile-picture"
              (error)="onImageError($event)"
            />
            <span *ngIf="!getProfilePictureUrl(doctor)" class="no-image">No image</span>
          </td>
          <td>{{ doctor.specialty || 'N/A' }}</td>
          <td>{{ doctor.email }}</td>
          <td>{{ doctor.phone }}</td>
          <td>
            <span [class]="doctor.isActive ? 'badge badge-success' : 'badge badge-danger'">
              {{ doctor.isActive ? 'Verified' : 'Not Verified' }}
            </span>
          </td>
          <td class="actions-cell">
            <button class="action-btn" (click)="onViewVerification(doctor)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              View Verification
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
