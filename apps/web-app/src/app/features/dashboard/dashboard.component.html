<div class="container">
  <div class="welcome-section">
    <div class="welcome-icon">👋</div>
    <div class="welcome-text">
      <h1>Hello, {{ getDisplayName() }}!</h1>
      <p>How are you feeling today?</p>
    </div>
  </div>

  <div class="cards-grid">
    <div class="card stat-card">
      <div class="stat-icon icon-lavender">
        <span class="material-icons">favorite</span>
      </div>
      <div class="stat-info">
        <p class="stat-label">Your Role</p>
        <p class="stat-value">{{ authService.getCurrentUser()?.role }}</p>
      </div>
    </div>

    <div class="card stat-card" *ngIf="authService.isAdmin()">
      <div class="stat-icon icon-sage">
        <span class="material-icons">group</span>
      </div>
      <div class="stat-info">
        <p class="stat-label">Admin Access</p>
        <p class="stat-value">
          <a routerLink="/users">Manage Users</a>
        </p>
      </div>
    </div>

    <div class="card stat-card">
      <div class="stat-icon icon-peach">
        <span class="material-icons">self_improvement</span>
      </div>
      <div class="stat-info">
        <p class="stat-label">Wellness</p>
        <p class="stat-value">Take a moment</p>
      </div>
    </div>

    <div class="card stat-card">
      <div class="stat-icon icon-warm">
        <span class="material-icons">verified_user</span>
      </div>
      <div class="stat-info">
        <p class="stat-label">Account Status</p>
        <p class="stat-value">Active</p>
      </div>
    </div>
  </div>
</div>
