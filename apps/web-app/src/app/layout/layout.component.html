<nav class="navbar">
  <div class="container navbar-inner">
    <a routerLink="/" class="navbar-brand">
      <img src="assets/logo.png" alt="Serenity" class="brand-logo" />
      <span>Serenity</span>
    </a>

    <div class="navbar-links" *ngIf="authService.isLoggedIn()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </a>
      <a routerLink="/profile" routerLinkActive="active">
        Profile
      </a>
      <a routerLink="/insurance" routerLinkActive="active">
        Reimbursements
      </a>
      <a routerLink="/marketplace" routerLinkActive="active">
        Marketplace
      </a>
      <a routerLink="/users" routerLinkActive="active" *ngIf="authService.isAdmin()">
        Users
      </a>

      <div class="notification-menu">
        <button class="notification-btn" type="button" (click)="toggleNotifications($event)" aria-label="Open notifications">
          <span class="bell">🔔</span>
          <span class="notification-badge" *ngIf="unreadNotificationCount > 0">{{ unreadNotificationCount }}</span>
        </button>
        <div class="notification-dropdown" *ngIf="notificationsOpen" (click)="$event.stopPropagation()">
          <div class="notification-header">
            <strong>Notifications</strong>
            <button type="button" class="mark-all-btn" (click)="markAllAsRead($event)" *ngIf="unreadNotificationCount > 0">
              Mark all read
            </button>
          </div>

          <div class="notification-state" *ngIf="notificationsLoading">Loading...</div>

          <div class="notification-state" *ngIf="!notificationsLoading && notifications.length === 0">
            No notifications yet.
          </div>

          <div class="notification-list" *ngIf="!notificationsLoading && notifications.length > 0">
            <button
              type="button"
              class="notification-item"
              *ngFor="let notification of notifications"
              [class.unread]="!notification.isRead"
              (click)="onNotificationClick(notification, $event)">
              <div class="notification-title-row">
                <span class="notification-title">{{ notification.title }}</span>
                <span class="dot" *ngIf="!notification.isRead"></span>
              </div>
              <p class="notification-message">{{ notification.message }}</p>
              <small class="notification-date">{{ formatNotificationDate(notification.createdAt) }}</small>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="navbar-actions" *ngIf="authService.isLoggedIn()">
      <span class="user-greeting" *ngIf="user">Hi, {{ getDisplayName() }}</span>
      <button class="btn btn-secondary btn-sm" (click)="logout()">Sign Out</button>
    </div>

    <div class="peek-character" *ngIf="authService.isLoggedIn() && characterVisible">
      <span class="peek-emoji">{{ getCharacterEmoji() }}</span>
    </div>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="footer" *ngIf="authService.isLoggedIn()">
  <div class="container footer-inner">
    <div class="footer-brand">
      <img src="assets/logo.png" alt="Serenity" class="footer-logo" />
      <span class="footer-name">Serenity</span>
    </div>
    <p class="footer-tagline">Wellness &amp; Balance</p>
    <div class="footer-links">
      <a routerLink="/">Dashboard</a>
      <a routerLink="/profile">Profile</a>
    </div>
    <div class="footer-divider"></div>
    <p class="footer-copy">&copy; {{ currentYear }} Serenity. All rights reserved.</p>
  </div>
</footer>
