services:

  mysql-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: healthcare_db
    volumes:
      - mysql_data:/var/lib/mysql

  postgres-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: doctor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always

  user-service:
    image: rayen209/serenity-user-service:latest
    restart: always
    depends_on:
      - mysql-db
      - redis
    environment:
      SERVER_PORT: 8081
      USER_PUBLIC_BASE_URL: http://localhost:8081

      DB_URL: jdbc:mysql://mysql-db:3306/healthcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      UPLOAD_DIR: uploads

      INSURANCE_API_URL: http://insurance-service:3000/api

