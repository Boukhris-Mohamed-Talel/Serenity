      BAN_CLEANUP_ZONE: Africa/Tunis

  doctor-service:
    image: rayen209/serenity-doctor-service:latest
    restart: always
    depends_on:
      - postgres-db
      - redis
    environment:
      SERVER_PORT: 8083

      SPRING_PROFILES_ACTIVE: dev

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/doctor_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

