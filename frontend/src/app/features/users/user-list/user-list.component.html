<div class="container">
  <div class="page-header">
    <h1>User Management</h1>
  </div>

  <div *ngIf="errorMessage" class="alert alert-error">
    {{ errorMessage }}
  </div>

  <div *ngIf="loading" class="loading-container">
    <span class="spinner"></span>
    <p>Loading users...</p>
  </div>

  <div *ngIf="!loading && users.length === 0" class="empty-state card">
    <p>No users found.</p>
  </div>

  <div *ngIf="!loading && users.length > 0" class="card table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.firstName }} {{ user.lastName }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span class="badge badge-primary">{{ user.role }}</span>
          </td>
          <td>
            <span [class]="user.isActive ? 'badge badge-success' : 'badge badge-danger'">
              {{ user.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td>{{ user.createdAt | date:'mediumDate' }}</td>
          <td class="actions">
            <a [routerLink]="['edit', user.id]" class="btn btn-secondary btn-sm">Edit</a>
            <button *ngIf="user.isActive" class="btn btn-secondary btn-sm" (click)="deactivateUser(user.id)">
              Deactivate
            </button>
            <button *ngIf="!user.isActive" class="btn btn-primary btn-sm" (click)="activateUser(user.id)">
              Activate
            </button>
            <button class="btn btn-danger btn-sm" (click)="deleteUser(user.id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
